[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-map"
version = "0.1.0"
description = "End-to-end streaming semantic mapping: StreamVGGT + SAM3 with bidirectional coupling."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "torch>=2.0",
    "pyyaml>=6.0",
    "pillow>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["semantic_map*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
