engine: mock
output_dir: outputs/mock
max_frames: null

pipeline:
  enable_drift_correction: true
  enable_reassociation: true

anchor:
  min_points: 64
  confidence_threshold: 0.3
  ema_momentum: 0.8
  max_scale_ratio: 4.0

drift:
  min_correspondences: 3
  max_residual: 0.5
  allow_scale: false
  ransac_iters: 64
  ransac_sample: 3

reassoc:
  min_lost_frames: 3
  max_center_distance_ratio: 1.5
  max_scale_ratio: 2.0
  require_same_category: true

map:
  voxel_size: 0.02
  confidence_threshold: 0.3
  store_rgb: false

reconstruction:
  image_size: [60, 80]
  num_frames: 30
  drift_per_frame: 0.02
  switch_frame: 15
  switch_victim: 0
  switch_new_id: 100
  lost_frames: 4
  seed: 0
